<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frailty–Inflammation Phenotype Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    background:linear-gradient(90deg,#1f4e79,#2c7fb8);
    color:white;
    padding:25px;
    border-radius:18px;
    margin-bottom:25px;
}

.main{
    display:flex;
    gap:25px;
    flex-wrap:wrap;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
}

.left{
    width:320px;
}

.right{
    flex:1;
}

h1{
    margin:0;
}

h2{
    margin-top:0;
    color:#1f4e79;
}

label{
    font-weight:bold;
}

input[type="number"]{
    width:100%;
    padding:12px;
    margin-top:6px;
    margin-bottom:18px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

.checkbox-group{
    margin-bottom:12px;
}

button{
    width:100%;
    background:#1f4e79;
    color:white;
    border:none;
    padding:14px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#163a5c;
}

.result-title{
    font-size:30px;
    font-weight:bold;
    margin-bottom:20px;
    color:#1f4e79;
}

.score{
    font-size:18px;
    line-height:1.9;
}

.target{
    color:#b30000;
    font-weight:bold;
    font-size:18px;
}

.nontarget{
    color:#2b7a2b;
    font-weight:bold;
    font-size:18px;
}

canvas{
    margin-top:30px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>Frailty–Inflammation Phenotype Calculator</h1>
<p>Dual-axis phenotype stratification based on inflammatory burden and Fried frailty phenotype.</p>
</div>

<div class="main">

<div class="card left">

<h2>Input Variables</h2>

<label>NLR</label>
<input type="number" id="nlr" value="2.0" step="0.1">

<label>SII</label>
<input type="number" id="sii" value="500" step="10">

<h3>Fried Components</h3>

<div class="checkbox-group">
<input type="checkbox" id="grip">
<label>Low grip strength</label>
</div>

<div class="checkbox-group">
<input type="checkbox" id="walk">
<label>Prolonged walking time</label>
</div>

<div class="checkbox-group">
<input type="checkbox" id="weight">
<label>Weight loss</label>
</div>

<div class="checkbox-group">
<input type="checkbox" id="fatigue">
<label>Fatigue</label>
</div>

<div class="checkbox-group">
<input type="checkbox" id="activity">
<label>Activity limitation</label>
</div>

<br>

<button onclick="calculatePhenotype()">
Calculate Phenotype
</button>

</div>

<div class="card right">

<div id="phenotype" class="result-title">
Awaiting calculation
</div>

<div id="scores" class="score">
Please input variables.
</div>

<br>

<div id="recommendation"></div>

<canvas id="plot" width="700" height="400"></canvas>

</div>

</div>

</div>

<script>

const mean_logNLR = 0.6948781;
const sd_logNLR = 0.4340205;

const mean_logSII = 5.866755;
const sd_logSII = 0.7265224;

const loading_NLR = 0.7071068;
const loading_SII = 0.7071068;

const inflam_cutoff = -0.0635091;
const frailty_cutoff = 1;

let chart;

function calculatePhenotype(){

    const nlr = parseFloat(document.getElementById("nlr").value);
    const sii = parseFloat(document.getElementById("sii").value);

    const grip = document.getElementById("grip").checked ? 1 : 0;
    const walk = document.getElementById("walk").checked ? 1 : 0;
    const weight = document.getElementById("weight").checked ? 1 : 0;
    const fatigue = document.getElementById("fatigue").checked ? 1 : 0;
    const activity = document.getElementById("activity").checked ? 1 : 0;

    const friedScore = grip + walk + weight + fatigue + activity;

    const logNLR = Math.log(nlr + 0.01);
    const logSII = Math.log(sii + 0.01);

    const zNLR = (logNLR - mean_logNLR) / sd_logNLR;
    const zSII = (logSII - mean_logSII) / sd_logSII;

    const inflammationScore =
        zNLR * loading_NLR +
        zSII * loading_SII;

    const frailtyState =
        friedScore >= frailty_cutoff ?
        "High frailty" :
        "Low frailty";

    const inflammationState =
        inflammationScore >= inflam_cutoff ?
        "High inflammation" :
        "Low inflammation";

    const phenotype =
        inflammationState + "–" + frailtyState;

    document.getElementById("phenotype").innerHTML =
        phenotype;

    document.getElementById("scores").innerHTML = `
        <b>Fried score:</b> ${friedScore}<br>
        <b>Inflammatory burden score:</b> ${inflammationScore.toFixed(3)}<br>
        <b>Frailty state:</b> ${frailtyState}<br>
        <b>Inflammatory state:</b> ${inflammationState}
    `;

    if(phenotype === "High inflammation–High frailty"){
        document.getElementById("recommendation").innerHTML =
        `<div class="target">
        Target phenotype: candidate for inflammation-associated frailty intervention study.
        </div>`;
    } else {
        document.getElementById("recommendation").innerHTML =
        `<div class="nontarget">
        Non-target phenotype for current intervention study.
        </div>`;
    }

    drawPlot(friedScore, inflammationScore);
}

function drawPlot(friedScore, inflammationScore){

    const ctx = document.getElementById('plot');

    if(chart){
        chart.destroy();
    }

    chart = new Chart(ctx, {
        type:'scatter',
        data:{
            datasets:[{
                label:'Patient',
                data:[{
                    x:friedScore,
                    y:inflammationScore
                }],
                pointRadius:10
            }]
        },
        options:{
            scales:{
                x:{
                    min:0,
                    max:5,
                    title:{
                        display:true,
                        text:'Fried score'
                    }
                },
                y:{
                    min:-3,
                    max:3,
                    title:{
                        display:true,
                        text:'Inflammatory burden score'
                    }
                }
            }
        }
    });
}

</script>

</body>
</html>
